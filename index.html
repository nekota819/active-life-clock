      copyRemain: "ACTIVE LIFE CLOCK: {c}、{age}歳。健康寿命({year}年推計 {hale}年)まで、平均であと{r}年。",
      copyOver: "ACTIVE LIFE CLOCK: {c}、{age}歳。平均の健康寿命({year}年推計 {hale}年)を{r}年超えています。",
      foot1: "出生時の健康寿命から現在の年齢を引いた、単純な目安です。集団の統計であり、個人の余命や健康状態の予測ではありません。一般に、この値は実際の残りの健康年数より短めに出ます。",
      foot2: "出典: WHO 出生時健康寿命(男女計)、{year}年推計(Our World in Data経由)。国により年次は異なる場合があります。入力した年齢は端末内で計算するだけで、送信も保存もしません。"
    },
    en: {
      lang: "en",
      preview: "Preview build: {n} countries (2021 estimates). Before release, we will check whether WHO has published newer estimates.",
      lead: "On average, how many healthy, active years are left?",
      age: "Your age", country: "Country",
      empty: "Enter your age and pick a country.",
      unit: "years",
      remainDesc: "of healthy life left on the statistical average",
      overDesc: "past the average healthy life expectancy",
      days: "about {d} days", months: "about {m} months", weeks: "about {w} weekends",
      overNote: "This is a population average. It says nothing certain about you.",
      lived: "Lived", remain: "Remaining", beyond: "Beyond average",
      copy: "Copy result", shareX: "Share on X", shareOs: "Share via other apps", tag: "#ACTIVELIFECLOCK", copied: "Copied", copyFail: "Copy failed. Select the text and copy it manually.",
      copyRemain: "ACTIVE LIFE CLOCK: {c}, age {age}. About {r} healthy years left against the average of {hale} ({year} estimate).",
      copyOver: "ACTIVE LIFE CLOCK: {c}, age {age}. {r} years past the average healthy life expectancy of {hale} ({year} estimate).",
      foot1: "A simple estimate: healthy life expectancy at birth minus your current age. It reflects population statistics, not a forecast of your lifespan or health. In general, it understates the healthy years that actually remain.",
      foot2: "Source: WHO healthy life expectancy at birth (both sexes), {year} estimate (via Our World in Data). Reference years may differ by country. Your age is calculated on your device only; nothing is sent or stored."
    },
    zh: {
      lang: "zh",
      preview: "预览版：收录 {n} 个国家（2021 年估计）。正式发布前将确认 WHO 是否已有更新的数据。",
      lead: "按平均水平，还剩多少年健康活跃的时间？",
      age: "年龄", country: "国家/地区",
      empty: "请输入年龄并选择国家/地区。",
      unit: "年",
      remainDesc: "按统计平均，剩余的健康时间",
      overDesc: "已超过平均健康预期寿命",
      days: "约 {d} 天", months: "约 {m} 个月", weeks: "约 {w} 个周末",
      overNote: "这是群体平均值，并不能确切说明你个人的情况。",
      lived: "已过", remain: "剩余", beyond: "超出平均",
      copy: "复制结果", shareX: "分享到 X", shareOs: "用其他应用分享", tag: "#ACTIVELIFECLOCK", copied: "已复制", copyFail: "复制失败，请手动选择文字复制。",
      copyRemain: "ACTIVE LIFE CLOCK：{c}，{age} 岁。距平均健康预期寿命（{year} 年估计 {hale} 年）还剩约 {r} 年。",
      copyOver: "ACTIVE LIFE CLOCK：{c}，{age} 岁。已超过平均健康预期寿命（{year} 年估计 {hale} 年）{r} 年。",
      foot1: "这是用出生时健康预期寿命减去当前年龄得到的简单估算。数据来自群体统计，并非对个人寿命或健康状况的预测。一般而言，此数值会比实际剩余的健康年数偏短。",
      foot2: "来源：WHO 出生时健康预期寿命（男女合计），{year} 年估计（经由 Our World in Data）。各国参考年份可能不同。年龄仅在你的设备上计算，不会发送或保存。"
    },
    es: {
      lang: "es",
      preview: "Versión preliminar: {n} países (estimaciones de 2021). Antes de publicar se comprobará si la OMS ha publicado datos más recientes.",
      lead: "¿Cuántos años de vida activa y saludable quedan, en promedio?",
      age: "Tu edad", country: "País",
      empty: "Introduce tu edad y elige un país.",
      unit: "años",
      remainDesc: "de vida saludable restantes según el promedio estadístico",
      overDesc: "por encima de la esperanza de vida saludable promedio",
      days: "unos {d} días", months: "unos {m} meses", weeks: "unos {w} fines de semana",
      overNote: "Es un promedio de población. No dice nada seguro sobre ti.",
      lived: "Vividos", remain: "Restantes", beyond: "Más allá del promedio",
      copy: "Copiar resultado", shareX: "Compartir en X", shareOs: "Compartir con otras apps", tag: "#ACTIVELIFECLOCK", copied: "Copiado", copyFail: "No se pudo copiar. Selecciona el texto y cópialo manualmente.",
      copyRemain: "ACTIVE LIFE CLOCK: {c}, {age} años. Quedan unos {r} años saludables frente al promedio de {hale} (estimación de {year}).",
      copyOver: "ACTIVE LIFE CLOCK: {c}, {age} años. {r} años por encima de la esperanza de vida saludable promedio de {hale} (estimación de {year}).",
      foot1: "Cálculo simple: esperanza de vida saludable al nacer menos la edad actual. Son estadísticas de población, no una predicción de tu vida ni de tu salud. En general, el resultado queda por debajo de los años saludables que realmente restan.",
      foot2: "Fuente: OMS, esperanza de vida saludable al nacer (ambos sexos), estimación de {year} (vía Our World in Data). El año de referencia puede variar según el país. Tu edad se calcula solo en tu dispositivo; no se envía ni se guarda."
    }
  };

  var BASIS = {
    ja: { title: "算出の根拠", fact: "{c}の出生時健康寿命: {hale}年(WHO、{year}年推計)", calc: "{hale} − {age} = {r}年(本ツールによる単純計算)", indep: "個人が運営する独立プロジェクトです。特定の企業の公式サービスではありません。" },
    en: { title: "Basis", fact: "Healthy life expectancy at birth, {c}: {hale} years (WHO, {year} estimate)", calc: "{hale} − {age} = {r} years (simple calculation by this tool)", indep: "An independent personal project. Not an official service of any company." },
    zh: { title: "计算依据", fact: "{c}出生时健康预期寿命：{hale} 年（WHO，{year} 年估计）", calc: "{hale} − {age} = {r} 年（本工具的简单计算）", indep: "这是个人运营的独立项目，并非任何公司的官方服务。" },
    es: { title: "Base del cálculo", fact: "Esperanza de vida saludable al nacer, {c}: {hale} años (OMS, estimación de {year})", calc: "{hale} − {age} = {r} años (cálculo simple de esta herramienta)", indep: "Proyecto personal independiente. No es un servicio oficial de ninguna empresa." }
  };

  var lang = "en";
  var nav = (navigator.language || "en").toLowerCase();
  if (nav.indexOf("ja") === 0) lang = "ja";
  else if (nav.indexOf("zh") === 0) lang = "zh";
  else if (nav.indexOf("es") === 0) lang = "es";

  var $ = function (id) { return document.getElementById(id); };
  var ageEl = $("age"), countryEl = $("country"), resultEl = $("result");
  var lastCopyText = "";

  function t() { return STR[lang]; }
  function fmt(s, o) {
    return s.replace(/\{(\w+)\}/g, function (_, k) { return o[k]; });
  }
  function num(n, d) {
    try { return n.toLocaleString(lang, { minimumFractionDigits: d, maximumFractionDigits: d }); }
    catch (e) { return n.toFixed(d); }
  }
  function regionName(code) {
    try { return new Intl.DisplayNames([lang], { type: "region" }).of(code) || code; }
    catch (e) { return code; }
  }

  function buildCountries() {
    var keep = countryEl.value || "JP";
    var codes = Object.keys(DATA).sort(function (a, b) {
      return regionName(a).localeCompare(regionName(b), lang);
    });
    countryEl.innerHTML = "";
    codes.forEach(function (c) {
      var o = document.createElement("option");
      o.value = c; o.textContent = regionName(c);
      countryEl.appendChild(o);
    });
    countryEl.value = DATA[keep] ? keep : "JP";
  }

  function renderStatic() {
    var s = t();
    document.documentElement.lang = s.lang;
    $("lead").textContent = s.lead;
    $("ageLabel").textContent = s.age;
    $("countryLabel").textContent = s.country;
    var btns = document.querySelectorAll(".langs button");
    for (var i = 0; i < btns.length; i++) {
      btns[i].setAttribute("aria-pressed", btns[i].getAttribute("data-lang") === lang ? "true" : "false");
    }
  }

  function renderFoot(year) {
    var s = t();
    $("foot").innerHTML = "";
    var p1 = document.createElement("p"); p1.textContent = s.foot1;
    var p2 = document.createElement("p"); p2.textContent = fmt(s.foot2, { year: year });
    var p3 = document.createElement("p"); p3.textContent = BASIS[lang].indep;
    $("foot").appendChild(p1); $("foot").appendChild(p2); $("foot").appendChild(p3);
  }

  function buildBar(age, hale) {
    var total = Math.max(Math.ceil(hale), age);
    var rows = Math.ceil(total / 10);
    var bar = document.createElement("div");
    bar.className = "bar";
    var floorH = Math.floor(hale);
    var frac = hale - floorH;
    for (var r = 0; r < rows; r++) {
      var row = document.createElement("div"); row.className = "row";
      var tick = document.createElement("div"); tick.className = "tick"; tick.textContent = String(r * 10);
      row.appendChild(tick);
      for (var c = 0; c < 10; c++) {
        var i = r * 10 + c;
        var cell = document.createElement("div");
        if (i >= total) { cell.className = "cell void"; }
        else if (i < age && i < hale) { cell.className = "cell lived"; }
        else if (i < age) { cell.className = "cell beyond"; }
        else if (i < floorH) { cell.className = "cell remain"; }
        else if (i === floorH && frac > 0) {
          cell.className = "cell";
          cell.style.background = "linear-gradient(90deg, var(--remain) 0 " + Math.round(frac * 100) + "%, transparent " + Math.round(frac * 100) + "% 100%)";
        } else { cell.className = "cell"; }
        row.appendChild(cell);
      }
      bar.appendChild(row);
    }
    return bar;
  }

  function dialEl(ratio, over) {
    var NS = "http://www.w3.org/2000/svg";
    function mk(tag, attrs, css) {
      var el = document.createElementNS(NS, tag);
      for (var k in attrs) el.setAttribute(k, attrs[k]);
      if (css) for (var c in css) el.style[c] = css[c];
      return el;
    }
    var GLASS = "M10 10 V14 C10 34 26 42 26 50 C26 58 10 66 10 86 V90 H50 V86 C50 66 34 58 34 50 C34 42 50 34 50 14 V10 Z";
    var r = Math.max(0, Math.min(1, ratio));
    var topH = 38 * r, botH = 38 * (1 - r);
    var svg = mk("svg", { viewBox: "0 0 160 160", width: "132", height: "132", "aria-hidden": "true", "class": "dial" });
    var defs = mk("defs", {});
    var cp = mk("clipPath", { id: "glassClip" });
    cp.appendChild(mk("path", { d: GLASS }));
    defs.appendChild(cp);
    svg.appendChild(defs);
    for (var i = 0; i < 60; i++) {
      var a = (i * 6 - 90) * Math.PI / 180, major = i % 5 === 0;
      var r1 = major ? 70 : 73, r2 = 77;
      svg.appendChild(mk("line", {
        x1: (80 + r1 * Math.cos(a)).toFixed(2), y1: (80 + r1 * Math.sin(a)).toFixed(2),
        x2: (80 + r2 * Math.cos(a)).toFixed(2), y2: (80 + r2 * Math.sin(a)).toFixed(2)
      }, { stroke: "var(--g-line)", strokeWidth: major ? "1.6" : "1", opacity: major ? "0.7" : "0.35" }));
    }
    svg.appendChild(mk("circle", { cx: 80, cy: 80, r: 62 }, { fill: "none", stroke: "var(--g-line)", strokeWidth: "4", opacity: "0.18" }));
    if (over) {
      svg.appendChild(mk("circle", { cx: 80, cy: 80, r: 62 }, { fill: "none", stroke: "var(--g-over)", strokeWidth: "4", strokeDasharray: "1 4", opacity: "0.8" }));
    } else if (r > 0) {
      svg.appendChild(mk("circle", { cx: 80, cy: 80, r: 62, transform: "rotate(-90 80 80)", "class": "arc" },
        { fill: "none", stroke: "var(--g-top)", strokeWidth: "4", strokeLinecap: "round", strokeDasharray: (r * 389.56).toFixed(1) + " 400" }));
    }
    var g = mk("g", { transform: "translate(60.8 48) scale(0.64)" });
    var clip = mk("g", { "clip-path": "url(#glassClip)" });
    if (topH > 0) clip.appendChild(mk("rect", { x: 0, y: 48 - topH, width: 60, height: topH }, { fill: "var(--g-top)" }));
    if (botH > 0) clip.appendChild(mk("rect", { x: 0, y: 90 - botH, width: 60, height: botH }, { fill: over ? "var(--g-over)" : "var(--g-bot)" }));
    g.appendChild(clip);
    if (r > 0) {
      g.appendChild(mk("line", { x1: 30, y1: 48, x2: 30, y2: 90 - botH, "class": "stream" },
        { stroke: "var(--g-stream)", strokeWidth: "2.4" }));
    }
    g.appendChild(mk("path", { d: GLASS }, { fill: "none", stroke: "var(--g-line)", strokeWidth: "4", strokeLinejoin: "round" }));
    g.appendChild(mk("rect", { x: 6, y: 4, width: 48, height: 5, rx: 2.5 }, { fill: "var(--g-line)" }));
    g.appendChild(mk("rect", { x: 6, y: 91, width: 48, height: 5, rx: 2.5 }, { fill: "var(--g-line)" }));
    svg.appendChild(g);
    return svg;
  }

  function copyText(text, statusEl) {
    var s = t();
    function done(ok) { statusEl.textContent = ok ? s.copied : s.copyFail; }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { done(true); }, function () { fallback(); });
        return;
      }
    } catch (e) { /* fall through */ }
    fallback();
    function fallback() {
      try {
        var ta = document.createElement("textarea");
        ta.value = text; ta.setAttribute("readonly", "");
        ta.style.position = "fixed"; ta.style.opacity = "0";
        document.body.appendChild(ta); ta.select();
        var ok = document.execCommand("copy");
        document.body.removeChild(ta);
        done(ok);
      } catch (e2) { done(false); }
    }
  }

  function render() {
    var s = t();
    var raw = ageEl.value.trim();
    var code = countryEl.value;
    var d = DATA[code];
    renderFoot(d ? d.year : 2021);
    resultEl.innerHTML = "";
    var age = parseInt(raw, 10);
    if (raw === "" || isNaN(age) || age < 0 || age > 120) {
      var e = document.createElement("div"); e.className = "empty"; e.textContent = s.empty;
      var h0 = document.createElement("div"); h0.className = "hero";
      h0.appendChild(e); h0.appendChild(dialEl(1, false));
      resultEl.appendChild(h0);
      return;
    }
    var hale = d.hale;
    var diff = hale - age;
    var over = diff <= 0;
    var shown = Math.abs(diff);
    var cname = regionName(code);

    var hero = document.createElement("div"); hero.className = "hero" + (over ? " over" : "");
    var heroText = document.createElement("div");
    var row = document.createElement("div"); row.className = "numrow";
    var n = document.createElement("span"); n.className = "num" + (over ? " over" : "");
    n.textContent = (over ? "+" : "") + num(shown, 1);
    var u = document.createElement("span"); u.className = "unit"; u.textContent = s.unit;
    row.appendChild(n); row.appendChild(u);
    heroText.appendChild(row);

    var desc = document.createElement("p"); desc.className = "desc";
    desc.textContent = over ? s.overDesc : s.remainDesc;
    heroText.appendChild(desc);

    if (!over) {
      var sub = document.createElement("p"); sub.className = "sub";
      sub.textContent = fmt(s.days, { d: num(Math.round(shown * 365.25), 0) }) + " / " +
        fmt(s.months, { m: num(Math.round(shown * 12), 0) }) + " / " +
        fmt(s.weeks, { w: num(Math.round(shown * 52.1775), 0) });
      heroText.appendChild(sub);
    } else {
      var note = document.createElement("p"); note.className = "note"; note.textContent = s.overNote;
      heroText.appendChild(note);
    }

    hero.appendChild(heroText);
    hero.appendChild(dialEl(over ? 0 : diff / hale, over));
    resultEl.appendChild(hero);

    var bs = BASIS[lang];
    var basis = document.createElement("div"); basis.className = "basis";
    var bt = document.createElement("div"); bt.className = "basis-title"; bt.textContent = bs.title;
    var bf = document.createElement("p");
    bf.textContent = fmt(bs.fact, { c: cname, hale: num(hale, 1), year: d.year });
    var bc = document.createElement("p");
    bc.textContent = fmt(bs.calc, { hale: num(hale, 1), age: age, r: (diff < 0 ? "−" : "") + num(Math.abs(diff), 1) });
    basis.appendChild(bt); basis.appendChild(bf); basis.appendChild(bc);
    resultEl.appendChild(basis);

    var bar = buildBar(age, hale);
    bar.setAttribute("role", "img");
    bar.setAttribute("aria-label", cname + ", " + age + ": " + (over ? "+" : "") + num(shown, 1) + " " + s.unit);
    resultEl.appendChild(bar);

    var lg = document.createElement("div"); lg.className = "legend";
    lg.innerHTML = '<span><i style="background:var(--lived);border-color:var(--lived)"></i></span>' +
      '<span><i style="background:var(--remain);border-color:var(--remain)"></i></span>' +
      (over || Math.max(Math.ceil(hale), age) > Math.ceil(hale) ? '<span><i style="border-color:var(--beyond);background:repeating-linear-gradient(135deg,var(--beyond) 0 2px,transparent 2px 5px)"></i></span>' : "");
    var spans = lg.querySelectorAll("span");
    var labels = [s.lived, s.remain, s.beyond];
    for (var i = 0; i < spans.length; i++) spans[i].appendChild(document.createTextNode(labels[i]));
    resultEl.appendChild(lg);

    lastCopyText = fmt(over ? s.copyOver : s.copyRemain, {
      c: cname, age: age, year: d.year, hale: num(hale, 1), r: num(shown, 1)
    });
    var act = document.createElement("div"); act.className = "actions";
    var btn = document.createElement("button"); btn.type = "button"; btn.textContent = s.copy;
    var st = document.createElement("span"); st.className = "status"; st.setAttribute("role", "status");
    btn.addEventListener("click", function () { copyText(lastCopyText, st); });

    var pageUrl = "";
    try { pageUrl = String(location.href).split("#")[0]; } catch (e3) { pageUrl = ""; }
    if (pageUrl.indexOf("http") !== 0) pageUrl = "";
    var shareText = lastCopyText + " " + s.tag;

    var xa = document.createElement("a");
    xa.href = "https://twitter.com/intent/tweet?text=" + encodeURIComponent(shareText) +
      (pageUrl ? "&url=" + encodeURIComponent(pageUrl) : "");
    xa.target = "_blank"; xa.rel = "noopener noreferrer";
    xa.textContent = s.shareX;

    act.appendChild(xa);
    if (navigator.share) {
      var sb = document.createElement("button"); sb.type = "button"; sb.textContent = s.shareOs;
      sb.addEventListener("click", function () {
        var payload = { text: shareText };
        if (pageUrl) payload.url = pageUrl;
        navigator.share(payload).catch(function (err) {
          if (err && err.name === "AbortError") return;
          copyText(shareText + (pageUrl ? " " + pageUrl : ""), st);
        });
      });
      act.appendChild(sb);
    }
    act.appendChild(btn); act.appendChild(st);
    resultEl.appendChild(act);
  }

  var langBtns = document.querySelectorAll(".langs button");
  for (var i = 0; i < langBtns.length; i++) {
    langBtns[i].addEventListener("click", function (ev) {
      lang = ev.currentTarget.getAttribute("data-lang");
      renderStatic(); buildCountries(); render();
    });
  }
  ageEl.addEventListener("input", render);
  countryEl.addEventListener("change", render);

  countryEl.value = "JP";
  renderStatic(); buildCountries(); render();
})();
</script>
